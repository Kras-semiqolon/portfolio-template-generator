<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #dbeafe,
                #e0e7ff,
                #f3e8ff
            );
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );
            color: white;
            text-align: center;
            padding: 28px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        main {
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .form-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            color: #4f46e5;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e7ff;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            color: #111827;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .save-area {
            text-align: center;
            margin-top: 10px;
        }

        .save-btn {
            width: 100%;
            max-width: 350px;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
        }

        .save-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            min-height: 22px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .saving {
            color: #4f46e5;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 24px;
            }

            main {
                margin-top: 20px;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Create Your Portfolio</h1>
    <p>Enter your information and save your portfolio.</p>
</header>

<main>

    <!-- IMPORTANT -->
    <!-- The form ID must stay portfolioForm -->
    <form id="portfolioForm">

        <!-- PERSONAL INFORMATION -->
        <div class="form-card">

            <div class="section-title">
                Personal Information
            </div>

            <div class="input-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="profilePicture">Profile Picture URL</label>
                <input
                    type="text"
                    id="profilePicture"
                    placeholder="Paste your profile picture URL"
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="contactNumber">Contact Number</label>
                <input
                    type="text"
                    id="contactNumber"
                    placeholder="Enter your contact number"
                >
            </div>

            <div class="input-group">
                <label for="address">Address</label>
                <input
                    type="text"
                    id="address"
                    placeholder="Enter your address"
                >
            </div>

        </div>


        <!-- ABOUT ME -->
        <div class="form-card">

            <div class="section-title">
                About Me
            </div>

            <div class="input-group">
                <label for="aboutMe">About Me</label>
                <textarea
                    id="aboutMe"
                    placeholder="Tell people about yourself..."
                ></textarea>
            </div>

        </div>


        <!-- EDUCATION -->
        <div class="form-card">

            <div class="section-title">
                Education
            </div>

            <div class="input-group">
                <label for="education">Education</label>
                <textarea
                    id="education"
                    placeholder="Example: BS Information Technology - Asian College of Technology"
                ></textarea>
            </div>

        </div>


        <!-- SKILLS -->
        <div class="form-card">

            <div class="section-title">
                Skills
            </div>

            <div class="input-group">
                <label for="skills">Skills</label>
                <textarea
                    id="skills"
                    placeholder="Example: HTML, CSS, JavaScript, Java..."
                ></textarea>
            </div>

        </div>


        <!-- PROJECTS -->
        <div class="form-card">

            <div class="section-title">
                Projects
            </div>

            <div class="input-group">
                <label for="project">Projects</label>
                <textarea
                    id="project"
                    placeholder="Describe your projects..."
                ></textarea>
            </div>

        </div>


        <!-- WORK EXPERIENCE -->
        <div class="form-card">

            <div class="section-title">
                Work Experience
            </div>

            <div class="input-group">
                <label for="workExperience">Work Experience</label>
                <textarea
                    id="workExperience"
                    placeholder="Describe your work experience..."
                ></textarea>
            </div>

        </div>


        <!-- SOCIAL LINKS -->
        <div class="form-card">

            <div class="section-title">
                Social Links
            </div>

            <div class="input-group">
                <label for="socialLinks">Social Links</label>
                <textarea
                    id="socialLinks"
                    placeholder="GitHub, Facebook, LinkedIn, etc."
                ></textarea>
            </div>

        </div>


        <!-- TEMPLATE -->
        <div class="form-card">

            <div class="section-title">
                Portfolio Template
            </div>

            <div class="input-group">
                <label for="template">Choose Template</label>

                <select id="template">

                    <option value="">
                        Select a template
                    </option>

                    <option value="modern">
                        Modern
                    </option>

                    <option value="classic">
                        Classic
                    </option>

                    <option value="minimal">
                        Minimal
                    </option>

                </select>

            </div>

        </div>


        <!-- SAVE -->
        <div class="save-area">

            <button
                type="submit"
                class="save-btn"
                id="saveButton"
            >
                Save Portfolio
            </button>

            <div
                id="saveStatus"
                class="status"
            ></div>

        </div>

    </form>

</main>


<!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- YOUR SUPABASE CONNECTION -->
<script src="supabase.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const form =
            document.getElementById("portfolioForm");

        const saveButton =
            document.getElementById("saveButton");

        const saveStatus =
            document.getElementById("saveStatus");


        if (!form) {

            console.error(
                "portfolioForm was not found."
            );

            return;
        }


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                saveButton.disabled = true;

                saveButton.textContent =
                    "Saving...";

                saveStatus.className =
                    "status saving";

                saveStatus.textContent =
                    "Saving your portfolio...";


                try {

                    if (
    typeof supabaseClient ===
    "undefined"
) {

    throw new Error(
        "Supabase is not connected. Check supabase.js."
    );

}


                    const portfolio = {

                        full_name:
                            document
                            .getElementById("fullName")
                            .value
                            .trim(),

                        profile_picture:
                            document
                            .getElementById("profilePicture")
                            .value
                            .trim(),

                        email:
                            document
                            .getElementById("email")
                            .value
                            .trim(),

                        contact_number:
                            document
                            .getElementById("contactNumber")
                            .value
                            .trim(),

                        address:
                            document
                            .getElementById("address")
                            .value
                            .trim(),

                        about_me:
                            document
                            .getElementById("aboutMe")
                            .value
                            .trim(),

                        education:
                            document
                            .getElementById("education")
                            .value
                            .trim(),

                        skills:
                            document
                            .getElementById("skills")
                            .value
                            .trim(),

                        projects:
                            document
                            .getElementById("project")
                            .value
                            .trim(),

                        work_experience:
                            document
                            .getElementById("workExperience")
                            .value
                            .trim(),

                        social_links:
                            document
                            .getElementById("socialLinks")
                            .value
                            .trim(),

                        template:
                            document
                            .getElementById("template")
                            .value
                    };


                    console.log(
                        "Sending portfolio:",
                        portfolio
                    );


                   const {
                        data,
                        error
                    } = await supabaseClient
                        .from("portfolios")
                        .insert([
                            portfolio
                        ])
                        .select();


                    if (error) {

                        throw error;

                    }


                    console.log(
                        "Saved successfully:",
                        data
                    );


                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Saved ✓";

                    saveStatus.className =
                        "status success";

                    saveStatus.textContent =
                        "Portfolio saved successfully!";

                }

                catch (error) {

                    console.error(
                        "SAVE ERROR:",
                        error
                    );


                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Save Portfolio";

                    saveStatus.className =
                        "status error";

                    saveStatus.textContent =
                        "Error: " +
                        error.message;

                }

            }
        );

    }
);

</script>

</body>
</html>
