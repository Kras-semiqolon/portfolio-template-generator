<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #dbeafe,
                #e0e7ff,
                #f3e8ff
            );
            color: #1f2937;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );
            color: white;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

        main {
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .form-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            color: #4f46e5;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e7ff;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 15px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .save-container {
            text-align: center;
            margin-top: 25px;
        }

        .save-btn {
            width: 100%;
            max-width: 360px;
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
            transition: 0.2s;
        }

        .save-btn:hover {
            transform: translateY(-2px);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        .save-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #saveStatus {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            min-height: 20px;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        .saving {
            color: #4f46e5;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 25px;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Create Your Portfolio</h1>
        <p>Enter your information to build your portfolio.</p>
    </header>


    <main>

        <!--
            IMPORTANT:
            This form ID is used by JavaScript.
        -->
        <form id="portfolioForm">


            <!-- PERSONAL INFORMATION -->
            <div class="form-card">

                <div class="section-title">
                    Personal Information
                </div>

                <div class="input-group">
                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="input-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="input-group">
                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="text"
                        id="contact"
                        placeholder="Enter your contact number"
                    >
                </div>


                <div class="input-group">
                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your address"
                    >
                </div>

            </div>


            <!-- ABOUT ME -->
            <div class="form-card">

                <div class="section-title">
                    About Me
                </div>

                <div class="input-group">

                    <label for="about">
                        About Me
                    </label>

                    <textarea
                        id="about"
                        placeholder="Tell us about yourself..."
                    ></textarea>

                </div>

            </div>


            <!-- EDUCATION -->
            <div class="form-card">

                <div class="section-title">
                    Education
                </div>

                <div class="input-group">

                    <label for="education">
                        Education
                    </label>

                    <textarea
                        id="education"
                        placeholder="Enter your educational background..."
                    ></textarea>

                </div>

            </div>


            <!-- SKILLS -->
            <div class="form-card">

                <div class="section-title">
                    Skills
                </div>

                <div class="input-group">

                    <label for="skills">
                        Skills
                    </label>

                    <textarea
                        id="skills"
                        placeholder="Example: HTML, CSS, JavaScript, Java..."
                    ></textarea>

                </div>

            </div>


            <!-- PROJECTS -->
            <div class="form-card">

                <div class="section-title">
                    Projects
                </div>

                <div class="input-group">

                    <label for="projects">
                        Projects
                    </label>

                    <textarea
                        id="projects"
                        placeholder="Describe your projects..."
                    ></textarea>

                </div>

            </div>


            <!-- WORK EXPERIENCE -->
            <div class="form-card">

                <div class="section-title">
                    Work Experience
                </div>

                <div class="input-group">

                    <label for="experience">
                        Work Experience
                    </label>

                    <textarea
                        id="experience"
                        placeholder="Describe your work experience..."
                    ></textarea>

                </div>

            </div>


            <!-- SOCIAL LINKS -->
            <div class="form-card">

                <div class="section-title">
                    Social Links
                </div>

                <div class="input-group">

                    <label for="socialLinks">
                        Social Links
                    </label>

                    <textarea
                        id="socialLinks"
                        placeholder="GitHub, Facebook, LinkedIn, etc."
                    ></textarea>

                </div>

            </div>


            <!-- SAVE -->
            <div class="save-container">

                <button
                    type="submit"
                    class="save-btn"
                    id="saveButton"
                >
                    Save Portfolio
                </button>

                <p id="saveStatus"></p>

            </div>


        </form>

    </main>


    <!-- SUPABASE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- YOUR SUPABASE CONNECTION -->
    <script src="supabase.js"></script>


    <!-- SAVE PORTFOLIO -->
    <script>

        const form =
            document.getElementById("portfolioForm");

        const saveButton =
            document.getElementById("saveButton");

        const saveStatus =
            document.getElementById("saveStatus");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                /*
                    Show that the button actually worked.
                */

                saveButton.disabled = true;

                saveButton.textContent =
                    "Saving...";

                saveStatus.textContent =
                    "Saving your portfolio...";

                saveStatus.className =
                    "saving";


                try {

                    /*
                        Check that Supabase loaded.
                    */

                    if (
                        typeof supabase === "undefined"
                    ) {
                        throw new Error(
                            "Supabase is not loaded. Check supabase.js."
                        );
                    }


                    /*
                        Get the values from the form.
                    */

                    const portfolio = {

                        full_name:
                            document
                            .getElementById("fullName")
                            .value
                            .trim(),

                        email:
                            document
                            .getElementById("email")
                            .value
                            .trim(),

                        contact_number:
                            document
                            .getElementById("contact")
                            .value
                            .trim(),

                        address:
                            document
                            .getElementById("address")
                            .value
                            .trim(),

                        about_me:
                            document
                            .getElementById("about")
                            .value
                            .trim(),

                        education:
                            document
                            .getElementById("education")
                            .value
                            .trim(),

                        skills:
                            document
                            .getElementById("skills")
                            .value
                            .trim(),

                        project:
                            document
                            .getElementById("projects")
                            .value
                            .trim(),

                        work_experience:
                            document
                            .getElementById("experience")
                            .value
                            .trim(),

                        social_links:
                            document
                            .getElementById("socialLinks")
                            .value
                            .trim()
                    };


                    /*
                        Send the portfolio to Supabase.
                    */

                    const result =
                        await supabase
                        .from("portfolios")
                        .insert([portfolio])
                        .select();


                    const data =
                        result.data;

                    const error =
                        result.error;


                    /*
                        If Supabase returns an error,
                        show it on the page.
                    */

                    if (error) {

                        console.error(
                            "Supabase error:",
                            error
                        );

                        throw new Error(
                            error.message
                        );
                    }


                    /*
                        SUCCESS
                    */

                    console.log(
                        "Portfolio saved:",
                        data
                    );


                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Saved ✓";

                    saveStatus.textContent =
                        "Portfolio saved successfully!";

                    saveStatus.className =
                        "success";


                    /*
                        Clear the form after saving.
                    */

                    form.reset();


                } catch (error) {

                    /*
                        ERROR
                    */

                    console.error(
                        "Save error:",
                        error
                    );


                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Save Portfolio";

                    saveStatus.textContent =
                        "Error: " +
                        error.message;

                    saveStatus.className =
                        "error";
                }

            }
        );

    </script>

</body>

</html>
