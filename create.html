<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #dbeafe,
                #e0e7ff,
                #f3e8ff
            );
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .form-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e7ff;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .save-container {
            text-align: center;
            margin-top: 25px;
        }

        .save-btn {
            width: 100%;
            max-width: 350px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
            transition: 0.2s;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 24px;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Create Your Portfolio</h1>
        <p>Fill in your information to create your portfolio.</p>
    </header>

    <main>

        <!-- IMPORTANT: The form ID must match the JavaScript -->
        <form id="portfolioForm">

            <!-- Personal Information -->
            <div class="form-card">

                <div class="section-title">
                    Personal Information
                </div>

                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="contact">Contact Number</label>
                    <input
                        type="text"
                        id="contact"
                        placeholder="Enter your contact number"
                    >
                </div>

                <div class="input-group">
                    <label for="address">Address</label>
                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your address"
                    >
                </div>

            </div>


            <!-- About Me -->
            <div class="form-card">

                <div class="section-title">
                    About Me
                </div>

                <div class="input-group">
                    <label for="about">About Me</label>
                    <textarea
                        id="about"
                        placeholder="Tell us about yourself..."
                    ></textarea>
                </div>

            </div>


            <!-- Education -->
            <div class="form-card">

                <div class="section-title">
                    Education
                </div>

                <div class="input-group">
                    <label for="education">Education</label>
                    <textarea
                        id="education"
                        placeholder="Enter your educational background..."
                    ></textarea>
                </div>

            </div>


            <!-- Skills -->
            <div class="form-card">

                <div class="section-title">
                    Skills
                </div>

                <div class="input-group">
                    <label for="skills">Skills</label>
                    <textarea
                        id="skills"
                        placeholder="Example: HTML, CSS, JavaScript, Java..."
                    ></textarea>
                </div>

            </div>


            <!-- Projects -->
            <div class="form-card">

                <div class="section-title">
                    Projects
                </div>

                <div class="input-group">
                    <label for="projects">Projects</label>
                    <textarea
                        id="projects"
                        placeholder="Describe your projects..."
                    ></textarea>
                </div>

            </div>


            <!-- Work Experience -->
            <div class="form-card">

                <div class="section-title">
                    Work Experience
                </div>

                <div class="input-group">
                    <label for="experience">Work Experience</label>
                    <textarea
                        id="experience"
                        placeholder="Describe your work experience..."
                    ></textarea>
                </div>

            </div>


            <!-- Social Links -->
            <div class="form-card">

                <div class="section-title">
                    Social Links
                </div>

                <div class="input-group">
                    <label for="socialLinks">Social Links</label>
                    <textarea
                        id="socialLinks"
                        placeholder="Facebook, GitHub, LinkedIn, etc."
                    ></textarea>
                </div>

            </div>


            <!-- SAVE BUTTON -->
            <div class="save-container">

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Portfolio
                </button>

            </div>

        </form>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase configuration -->
    <script src="supabase.js"></script>


    <!-- Save Portfolio -->
    <script>

        const form =
            document.getElementById("portfolioForm");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const {
                    data,
                    error
                } = await supabase
                    .from("portfolios")
                    .insert([
                        {
                            full_name:
                                document
                                .getElementById("fullName")
                                .value,

                            email:
                                document
                                .getElementById("email")
                                .value,

                            contact_number:
                                document
                                .getElementById("contact")
                                .value,

                            address:
                                document
                                .getElementById("address")
                                .value,

                            about_me:
                                document
                                .getElementById("about")
                                .value,

                            education:
                                document
                                .getElementById("education")
                                .value,

                            skills:
                                document
                                .getElementById("skills")
                                .value,

                            project:
                                document
                                .getElementById("projects")
                                .value,

                            work_experience:
                                document
                                .getElementById("experience")
                                .value,

                            social_links:
                                document
                                .getElementById("socialLinks")
                                .value
                        }
                    ]);


                if (error) {

                    console.error(error);

                    alert(
                        "Error saving portfolio:\n"
                        + error.message
                    );

                    return;
                }


                alert(
                    "Portfolio saved successfully!"
                );


                form.reset();

            }
        );

    </script>

</body>

</html>
