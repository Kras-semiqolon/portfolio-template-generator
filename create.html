<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            padding-bottom: 40px;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
        }

        .form-section {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .button-area {
            text-align: center;
        }

        .save-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <h1>Create Your Portfolio</h1>
        <p>Enter your information below.</p>
    </header>

    <main class="container">

        <form id="portfolioForm">

            <!-- Personal Information -->
            <section class="form-section">

                <h2>Personal Information</h2>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="profilePicture">Profile Picture</label>
                    <input
                        type="file"
                        id="profilePicture"
                        name="profilePicture"
                        accept="image/*"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="09XXXXXXXXX"
                    >
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                    >
                </div>

                <div class="form-group">
                    <label for="about">About Me</label>
                    <textarea
                        id="about"
                        name="about"
                        placeholder="Tell something about yourself..."
                    ></textarea>
                </div>

            </section>

            <!-- Education -->
            <section class="form-section">

                <h2>Educational Background</h2>

                <div class="form-group">
                    <label for="education">Education</label>
                    <textarea
                        id="education"
                        name="education"
                        placeholder="School, course, year, achievements, etc."
                    ></textarea>
                </div>

            </section>

            <!-- Skills -->
            <section class="form-section">

                <h2>Skills</h2>

                <div class="form-group">
                    <label for="skills">Skills</label>
                    <textarea
                        id="skills"
                        name="skills"
                        placeholder="Example: HTML, CSS, JavaScript, Java, C..."
                    ></textarea>
                </div>

            </section>

            <!-- Projects -->
            <section class="form-section">

                <h2>Projects</h2>

                <div class="form-group">
                    <label for="projects">Projects</label>
                    <textarea
                        id="projects"
                        name="projects"
                        placeholder="Describe your projects..."
                    ></textarea>
                </div>

            </section>

            <!-- Work Experience -->
            <section class="form-section">

                <h2>Work Experience</h2>

                <div class="form-group">
                    <label for="experience">Work Experience</label>
                    <textarea
                        id="experience"
                        name="experience"
                        placeholder="Company, position, responsibilities, etc."
                    ></textarea>
                </div>

            </section>

            <!-- Social Links -->
            <section class="form-section">

                <h2>Social Media / Website</h2>

                <div class="form-group">
                    <label for="socialLinks">Links</label>
                    <textarea
                        id="socialLinks"
                        name="socialLinks"
                        placeholder="Facebook, Instagram, GitHub, personal website, etc."
                    ></textarea>
                </div>

            </section>

            <div class="button-area">

                <button type="submit" class="save-btn">
                    Save Portfolio
                </button>

                <br>

                <a href="index.html" class="back-btn">
                    ← Back to Home
                </a>

            </div>

        </form>

    </main>

    <script>
        const form = document.getElementById("portfolioForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            alert("The form is working! We will connect this button to Supabase later.");
        });
    </script>

</body>
</html>
