<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Log In | Portfolio Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{min-height:100vh;background:linear-gradient(135deg,#dbeafe,#e0e7ff,#f3e8ff);color:#1f2937}.topnav{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;padding:10px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}.topnav a{padding:8px 13px;border-radius:20px;color:white;text-decoration:none;font-size:14px;font-weight:bold}.topnav a.active,.topnav a:hover{background:#ffffff40}.wrap{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:25px}.card{width:100%;max-width:440px;background:#fff;border-radius:20px;padding:32px;box-shadow:0 8px 25px #00000014}.logo{text-align:center;color:#4f46e5;font-size:13px;font-weight:bold;letter-spacing:1px;margin-bottom:10px}.card h1{text-align:center;font-size:28px;margin-bottom:8px;color:#111827}.sub{text-align:center;color:#6b7280;font-size:14px;margin-bottom:25px;line-height:1.5}.field{margin-bottom:16px}label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}input:focus{outline:2px solid #c7d2fe;border-color:#6366f1}.submit{width:100%;border:0;border-radius:10px;padding:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;margin-top:4px}.message{font-size:13px;color:#6b7280;text-align:center;margin-top:14px;min-height:18px}.switch{text-align:center;font-size:14px;margin-top:20px;color:#6b7280}.switch a{color:#4f46e5;font-weight:bold;text-decoration:none}.home{text-align:center;margin-top:14px;font-size:13px}.home a{color:#4f46e5;text-decoration:none}@media(max-width:480px){.card{padding:25px 20px}}
</style></head><body>
<nav class="topnav"><a href="index.html">Home</a><a href="login.html" class="active">Log In</a><a href="register.html">Register</a><a href="create.html">Create</a></nav>
<main class="wrap"><section class="card"><div class="logo">PORTFOLIO GENERATOR</div><h1>Welcome back</h1><p class="sub">Log in to continue to your portfolio workspace.</p>
<form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password"></div><button class="submit" type="submit">Log In</button><p id="message" class="message" role="status"></p></form>
<p class="switch">Don't have an account? <a href="register.html">Create one</a></p><p class="home"><a href="index.html">← Back to Home</a></p></section></main>
<script>
/* UI prototype only: this form does not authenticate users yet. */
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('message').textContent='Login authentication is not connected yet. Connect this form to your authentication provider before using real accounts.';});
</script></body></html>
